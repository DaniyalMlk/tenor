[build-system]
# 77 is the floor for the SPDX `license` expression and `license-files` below.
# Anything older reads `license = "MIT"` as a legacy table and fails the build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tenor"
version = "0.1.0"
description = "A fixed-income curve toolkit: day counts, discount curves, bond analytics, key rate risk and option-adjusted spread."
readme = "README.md"
requires-python = ">=3.10"
# The legacy `license = { text = "MIT" }` table this replaces put the word MIT in
# the metadata and left the LICENSE file out of the distribution entirely.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniyal" }]
keywords = [
    "fixed-income",
    "yield-curve",
    "bootstrapping",
    "bond-analytics",
    "day-count",
    "duration",
    "key-rate-duration",
    "option-adjusted-spread",
    "quantitative-finance",
]
# No `License ::` classifier: it is mutually exclusive with the SPDX expression
# above, and supplying both is an error rather than a duplication.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DaniyalMlk/tenor"
Source = "https://github.com/DaniyalMlk/tenor"
Issues = "https://github.com/DaniyalMlk/tenor/issues"

[project.scripts]
tenor = "tenor.cli:main"

[project.optional-dependencies]
# Nothing is needed to run this. Everything below is for checking the code.
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Deliberately not pinned to a version. Pinning makes mypy read every installed
# stub as though it were written for that version, and the failure that produces
# is in somebody else's file: numpy's stubs use a `type` statement, which is a
# syntax error below 3.12, so a pin of 3.11 fails when the checker runs on a 3.12
# interpreter that happens to have numpy beside it. This project does not depend
# on numpy and its own continuous integration never saw it — but anyone who
# installs it into an environment with numpy in it does, and the error names a
# file they did not write. Left unset, mypy checks against whatever it is running
# on, which is the version being tested anyway.
strict = true
files = ["src", "tests"]
warn_unreachable = true

# `tomllib` entered the standard library in 3.11, and mypy resolves imports
# against the interpreter it is run under. The metadata test's guarded import of
# it — behind a skipif on the same version — is the only mention in the tree, and
# on 3.10 it would otherwise be an unresolvable import. This was hidden by the
# version pin that used to be above.
[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
