name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy --strict
      - name: Lint
        run: ruff check .

  package:
    name: Wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
      - name: The installed package computes something
        # A wheel that imports but cannot produce a number is not a working
        # library, so the check runs the conventions end to end and asserts the
        # disagreement they exist to keep straight.
        run: |
          /tmp/check/bin/python - <<'PY'
          from datetime import date
          from tenor import Basis, Frequency, day_count, generate, calendar_from

          start, end = date(2021, 2, 28), date(2021, 8, 31)
          counts = {basis: day_count(start, end, basis) for basis in Basis}
          assert counts[Basis.THIRTY_360_BOND] == 183, counts
          assert counts[Basis.THIRTY_E_360] == 182, counts
          assert counts[Basis.THIRTY_360_US] == 180, counts

          schedule = generate(
              date(2021, 3, 10), date(2024, 8, 15), Frequency.SEMI_ANNUAL,
              calendar=calendar_from("US", [date(2021, 7, 5)]),
          )
          assert len(schedule) == 7, len(schedule)
          assert schedule.has_stub

          # And the whole chain, since the library is no longer only conventions:
          # quotes to curve to bond, with the identity the curve rests on.
          from tenor import Bond, Deposit, Swap, bootstrap

          reference = date(2021, 1, 5)
          built = bootstrap(
              reference,
              [
                  Deposit(reference, date(2021, 7, 5), 0.002, Basis.ACT_360),
                  Swap(reference, date(2026, 1, 5), 0.015),
                  Swap(reference, date(2031, 1, 5), 0.022),
              ],
              basis=Basis.ACT_365F,
          )
          assert built.reprices(1e-12), built.worst_error
          price = Bond(reference, date(2031, 1, 5), 0.05).price_from_curve(
              built.curve, reference
          )
          assert 100.0 < price < 200.0, price
          print(f"three 30/360 conventions gave {sorted(set(counts.values()))} days; "
                f"curve worst error {built.worst_error:.2e}; bond at {price:.6f}")
          PY

  example:
    name: The worked example reproduces its published figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Worked example
        # Exits non-zero if any published figure fails to reproduce, so a
        # change to the numerics cannot quietly move a number that has been in
        # print for years.
        run: python examples/worked.py
      - name: The command line runs over the bundled quotes
        run: |
          tenor curve examples/quotes.txt --reference 2021-01-05 --basis ACT_365F
          tenor curve examples/quotes.txt --reference 2021-01-05 --basis ACT_365F \
            --interpolation MONOTONE_CONVEX
          tenor price examples/quotes.txt --reference 2021-01-05 --basis ACT_365F \
            --maturity 2031-01-05 --coupon 0.05 --quote 120
          tenor risk examples/quotes.txt --reference 2021-01-05 --basis ACT_365F \
            --maturity 2031-01-05 --coupon 0.05 --buckets 0.5 2 5 10
          tenor option examples/quotes.txt --reference 2021-01-05 --basis ACT_365F \
            --maturity 2031-01-05 --coupon 0.05 --volatility 0.15 \
            --first-call 2026-01-05
          tenor --json curve examples/quotes.txt --reference 2021-01-05 \
            --basis ACT_365F > /dev/null
